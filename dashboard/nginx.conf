server {
    # O Nginx ficará disponível na porta 80 do container.
    listen 80;

    # Aceita requisições independentemente do nome utilizado.
    server_name _;

    # Diretório que contém HTML, CSS e JavaScript.
    root /usr/share/nginx/html;

    # Arquivo inicial do dashboard.
    index index.html;

    # Entrega os arquivos do dashboard ao navegador.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Encaminha chamadas iniciadas por /api para a FastAPI.
    location /api/ {
        # "api" é o nome do serviço na rede do Docker Compose.
        proxy_pass http://api:8000/;

        # Preserva informações da requisição original.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}