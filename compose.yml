# Define os serviços que fazem parte da aplicação.
services:
  # Serviço responsável pela API FastAPI.
  api:
    # Determina como a imagem da API será construída.
    build:
      # Usa a raiz do projeto como contexto da construção.
      context: .

      # Arquivo que contém as instruções de construção.
      dockerfile: Dockerfile

    # Nome e tag da imagem construída pelo Compose.
    image: lab-docker-cicd:compose

    # Nome utilizado para identificar o container da API.
    container_name: lab-api-compose

    # Disponibiliza a variável de conexão dentro do container.
    environment:
      DATABASE_URL: ${DATABASE_URL}

    # A API somente será iniciada depois que o PostgreSQL
    # estiver aceitando conexões.
    depends_on:
      db:
        condition: service_healthy

    # Porta 8002 do Windows direcionada à porta 8000 do container.
    ports:
      - "8002:8000"

    # Reinicia o container após falhas ou reinício do Docker Desktop.
    restart: unless-stopped

    # Verifica periodicamente se a API está respondendo.
    healthcheck:
      # Executa uma requisição para o endpoint /health.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"

      # Executa a verificação a cada trinta segundos.
      interval: 30s

      # Cada tentativa poderá durar no máximo cinco segundos.
      timeout: 5s

      # Marca a API como unhealthy após três falhas consecutivas.
      retries: 3

      # Aguarda dez segundos antes de contabilizar falhas.
      start_period: 10s

  # Serviço responsável pelo banco de dados PostgreSQL.
  db:
    # Utiliza uma imagem oficial e compacta do PostgreSQL.
    image: postgres:17-alpine

    # Nome utilizado para identificar o container do banco.
    container_name: lab-db-compose

    # Configura o PostgreSQL com os valores existentes no arquivo .env.
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    # Armazena os dados fora da camada interna do container.
    volumes:
      - postgres_data:/var/lib/postgresql/data

    # Verifica se o PostgreSQL está aceitando conexões.
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"

      # Executa a verificação a cada dez segundos.
      interval: 10s

      # Cada tentativa poderá durar no máximo cinco segundos.
      timeout: 5s

      # Marca o banco como unhealthy após cinco falhas consecutivas.
      retries: 5

      # Aguarda dez segundos antes de contabilizar falhas.
      start_period: 10s

    # Reinicia o banco após falhas ou reinício do Docker Desktop.
    restart: unless-stopped

# Declara os volumes administrados pelo Docker Compose.
volumes:
  # Volume que preservará os dados do PostgreSQL.
  postgres_data:
