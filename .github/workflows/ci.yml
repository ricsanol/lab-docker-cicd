# Define o nome que aparecerá na aba Actions do GitHub.
name: CI - Testes e Docker


# Define os acontecimentos que iniciam automaticamente a CI.
on:

  # Executa a CI quando houver envio de código para o GitHub.
  push:

    # Limita a a execução aos pushes realizados na branch main.
    branches:
      - main

  # Também executa a CI quando um Pull Request
  # tiver a branch main como destino.
  pull_request:
    branches:
      - main


# Concede ao processo apenas permissão de leitura do repositório.
# Essa é uma configuração de segurança.
permissions:
  contents: read


# Define os trabalhos que serão executados pela CI.
jobs:

  # Nome interno do nosso trabalho.
  validar-aplicacao:

    # Nome apresentado visualmente no GitHub.
    name: Testar aplicação e construir Docker

    # Define um limite de dez minutos para o trabalho.
    # Isso evita deixar uma execução presa indefinidamente.
    timeout-minutes: 10

    # Solicita ao GitHub uma máquina virtual Linux.
    runs-on: ubuntu-latest

    # Lista ordenada das etapas executadas nessa máquina.
    steps:

      # Baixa o conteúdo do nosso repositório
      # para dentro da máquina temporária do GitHub.
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      # Instala e configura o Python 3.13.
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:

          # Escolhe a mesma versão principal usada no laboratório.
          python-version: "3.13"

          # Armazena dependências entre execuções
          # para acelerar as próximas instalações.
          cache: pip

      # Instala as dependências registradas no requirements.txt.
      -. apply_patch was used to modify code without being invoked. The terminal should be used instead.
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # Executa os testes automatizados com informações detalhadas.
      - name: Executar testes
        run: python -m pytest -v

      # Tenta construir a imagem utilizando nosso Dockerfile.
      # Se o Dockerfile estiver inválido, a CI será reprovada.
      - name: Construir imagem Docker
        run: docker build --tag lab-docker-cicd:ci .
