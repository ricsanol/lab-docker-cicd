# Nome apresentado na aba Actions do GitHub.
name: CI/CD - API, PostgreSQL e Dashboard

# Acontecimentos que iniciam o workflow.
on:
  # Executa depois que um código entra na main.
  push:
    branches:
      - main

  # Executa para validar Pull Requests destinados à main.
  pull_request:
    branches:
      - main

# Permissões concedidas ao workflow.
permissions:
  # Permite baixar o código do repositório.
  contents: read

  # Permite publicar imagens no GitHub Container Registry.
  packages: write

jobs:
  # Primeiro trabalho: testa e constrói toda a aplicação.
  validar-aplicacao:
    name: Testar e construir aplicação

    # Máquina Linux temporária fornecida pelo GitHub.
    runs-on: ubuntu-latest

    # Interrompe o trabalho se ultrapassar quinze minutos.
    timeout-minutes: 15

    # Valores utilizados somente no ambiente temporário da CI.
    env:
      POSTGRES_DB: labdb
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD: lab_ci_password
      DATABASE_URL: postgresql+psycopg://labuser:lab_ci_password@db:5432/labdb

    steps:
      # Baixa o código do commit que está sendo validado.
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      # Verifica a estrutura completa do compose.yml.
      - name: Validar Docker Compose
        run: docker compose config --quiet

      # Instala e configura o Python utilizado nos testes.
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Instala as dependências registradas no projeto.
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # Executa todos os testes automatizados.
      - name: Executar testes
        run: python -m pytest -v

      # Constrói a imagem da API.
      - name: Construir imagem da API
        run: docker build --tag lab-docker-cicd:ci .

      # Constrói a imagem do dashboard.
      - name: Construir imagem do dashboard
        run: docker build --tag lab-docker-cicd-dashboard:ci ./dashboard

      # Solicita ao Nginx que valide sua configuração.
      - name: Validar configuração do Nginx
        run:
          docker run --rm lab-docker-cicd-dashboard:ci nginx -t

          # Inicia PostgreSQL, API e dashboard.
      # A opção --wait aguarda os healthchecks ficarem saudáveis.
      - name: Iniciar aplicação integrada
        run: |
          docker compose up \
            --detach \
            --build \
            --wait \
            --wait-timeout 120

      # Executa o fluxo Nginx, FastAPI e PostgreSQL.
      - name: Executar teste integrado
        run: python scripts/integration_check.py

      # Apresenta os logs caso alguma etapa anterior falhe.
      - name: Exibir logs dos containers
        if: failure()
        run: docker compose logs --no-color

      # Remove os recursos criados na máquina temporária.
      # Esta etapa executa mesmo quando ocorrer uma falha.
      - name: Encerrar ambiente integrado
        if: always()
        run: docker compose down --volumes

    # Segundo trabalho: publica as imagens da API e do dashboard.
  publicar-imagens:
    name: Publicar imagens no GHCR

    # Somente começa depois que todas as validações terminarem.
    needs: validar-aplicacao

    # Executa somente depois de um push na main.
    # Pull Requests são testados, mas não publicam imagens.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Endereços das imagens no GitHub Container Registry.
    env:
      API_IMAGE: ghcr.io/ricsanol/lab-docker-cicd
      DASHBOARD_IMAGE: ghcr.io/ricsanol/lab-docker-cicd-dashboard

    steps:
      # Baixa novamente o código para esta máquina.
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      # Autentica o Docker no registro de imagens do GitHub.
      - name: Autenticar no GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" |
          docker login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

      # Constrói a imagem da API com duas tags.
      - name: Construir imagem da API para publicação
        run: |
          docker build \
            --tag "${API_IMAGE}:latest" \
            --tag "${API_IMAGE}:${{ github.sha }}" \
            .

      # Constrói a imagem do dashboard com duas tags.
      - name: Construir imagem do dashboard para publicação
        run: |
          docker build \
            --tag "${DASHBOARD_IMAGE}:latest" \
            --tag "${DASHBOARD_IMAGE}:${{ github.sha }}" \
            ./dashboard

      # Publica as tags latest e SHA da API.
      - name: Publicar imagem da API
        run: |
          docker push "${API_IMAGE}:latest"
          docker push "${API_IMAGE}:${{ github.sha }}"

      # Publica as tags latest e SHA do dashboard.
      - name: Publicar imagem do dashboard
        run: |
          docker push "${DASHBOARD_IMAGE}:latest"
          docker push "${DASHBOARD_IMAGE}:${{ github.sha }}"
