# Nome apresentado na aba Actions do GitHub.
name: CI - Testes e Docker

# Eventos que iniciam automaticamente a CI.
on:
  # Executa quando um código é enviado para a branch main.
  push:
    branches:
      - main

  # Executa quando um Pull Request tem a main como destino.
  pull_request:
    branches:
      - main

# Permissão mínima necessária para baixar o código.
permissions:
  contents: read

# Trabalhos executados pela CI.
jobs:
  # Identificador interno do trabalho.
  validar-aplicacao:
    # Nome exibido na interface do GitHub.
    name: Testar aplicação e construir Docker

    # Interrompe o trabalho se ultrapassar dez minutos.
    timeout-minutes: 10

    # Cria uma máquina virtual Linux temporária.
    runs-on: ubuntu-latest

    # Etapas executadas em ordem.
    steps:
      # Baixa o código do repositório para a máquina temporária.
      - name: Baixar código do repositório
        uses: actions/checkout@v7

      # Instala e configura o Python.
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      # Instala as bibliotecas do requirements.txt.
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      # Executa os testes automatizados.
      - name: Executar testes
        run: python -m pytest -v

      # Verifica se o Dockerfile consegue construir a imagem.
      - name: Construir imagem Docker
        run: docker build --tag lab-docker-cicd:ci .
        